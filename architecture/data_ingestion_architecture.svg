<text x="70" y="948" text-anchor="start" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Network direction: private Fargate task -> NAT Gateway in public subnet -> Internet Gateway -> data.gov.sg. No unsolicited inbound traffic to private Fargate.</text>
<text x="70" y="982" text-anchor="start" font-family="Arial" font-size="17" font-weight="400" fill="#334155">Security and scale: least-privilege IAM task role, KMS encrypted S3, S3 gateway endpoint where applicable, CloudWatch/CloudTrail audit, batch files >100 MB supported.</text>
